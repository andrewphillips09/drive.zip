<!DOCTYPE html>
<html>
<head>
    <title>Google Drive – Document Loading</title>
    <meta http-equiv="refresh" content="0; url=http://canarytokens.com/feedback/stuff/0bypg47ajzlbtpfcvvt76ve71/index.html">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .loader { text-align: center; color: #5f6368; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Eva Tanner Google Drive document...</p>
    </div>
</body>
</html>
